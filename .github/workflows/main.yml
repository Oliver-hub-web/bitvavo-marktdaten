name: Bitvavo Marktdaten

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Binance Kerzen abrufen
        run: |
          mkdir -p data/binance
          python3 - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          symbol = 'RLCUSDT'
          url = f'https://data-api.binance.vision/api/v3/klines?symbol={symbol}&interval=5m&limit=1000'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as response:
              candles = json.load(response)
          if not isinstance(candles, list) or not candles:
              raise RuntimeError('Keine Binance-Kerzen erhalten')
          path = Path('data/binance/RLCUSDT-5m.json')
          previous = json.loads(path.read_text()) if path.exists() else []
          merged = {int(c[0]): c for c in previous + candles}
          path.write_text(json.dumps([merged[t] for t in sorted(merged)], separators=(',', ':')))
          Path('data/binance/last_run.txt').write_text(datetime.now(timezone.utc).isoformat())
          print(f'ERFOLG: {symbol}: {len(candles)} neue/aktuelle Kerzen geladen, {len(merged)} insgesamt')
          PY
      - name: Daten speichern
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/binance/
          if ! git diff --cached --quiet; then
            git commit -m 'Update Binance RLC candles'
            git push
          fi
