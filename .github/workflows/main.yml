name: Bitvavo Marktdaten

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Broad Binance spot radar and follow-up
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.parse
          from pathlib import Path
          from datetime import datetime, timezone

          ROOT = Path('data/radar')
          ROOT.mkdir(parents=True, exist_ok=True)
          now = int(time.time() * 1000)
          def fetch(path, params=None):
              url = 'https://data-api.binance.vision/api/v3/' + path
              if params:
                  url += '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'User-Agent': 'crypto-market-research/1.0'})
              with urllib.request.urlopen(req, timeout=18) as response:
                  return json.load(response)
          def load(path, default):
              try:
                  return json.loads(path.read_text())
              except (OSError, ValueError):
                  return default
          def save(path, data):
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2))

          # Discover the actual available spot universe, not a fixed list of 20 coins.
          info = fetch('exchangeInfo')
          # Stablecoin bases often create misleading pump signals.
          stable_bases = {'USDT','USDC','FDUSD','TUSD','USDE','USDD','DAI',
                          'USDP','PYUSD','EURC','EURI','AEUR','XUSD','U'}
          tradable = {m['symbol'] for m in info['symbols']
                      if m.get('status') == 'TRADING' and m.get('isSpotTradingAllowed', True)
                      and m.get('quoteAsset') in ('USDT', 'USDC', 'EUR')
                      and m.get('baseAsset') not in stable_bases}
          tickers = fetch('ticker/24hr')
          market = {t['symbol']: t for t in tickers if t.get('symbol') in tradable}
          def num(t, key):
              try: return float(t.get(key, 0))
              except (TypeError, ValueError): return 0.0
          # Filter out low-liquidity markets and leveraged token lookalikes.
          candidates = []
          for symbol, t in market.items():
              base = symbol[:-4] if symbol.endswith(('USDT','USDC')) else symbol[:-3]
              if base.endswith(('UP','DOWN','BULL','BEAR')):
                  continue
              change = num(t, 'priceChangePercent')
              qvol = num(t, 'quoteVolume')
              # EUR and stablecoin quoted volumes are comparable only approximately.
              if qvol < 100000 or change < -6 or change >= 30:
                  continue
              score = (5 if 0 <= change < 15 else 0) + min(qvol / 500000, 5)
              if -2 <= change < 15:
                  candidates.append((score, symbol, t))
          candidates.sort(reverse=True)
          # Rotate coverage so less prominent coins are not excluded indefinitely.
          # Tickers for every tradable market are checked each run.
          # Expensive 5m candles rotate across all eligible candidates.
          # Priority candidates are scanned every run; tail coverage cycles.
          priority_count = 50
          batch_count = 170
          ordered = candidates[:priority_count]
          tail = candidates[priority_count:]
          if tail:
              scan_slot = int(time.time()) // 300
              start = (scan_slot * batch_count) % len(tail)
              ordered += (tail[start:] + tail[:start])[:batch_count]
          # Probe Bitvavo's public market list. No EUR prices are inferred.
          bitvavo_status = {'available': False, 'eur_markets': None}
          try:
              req = urllib.request.Request('https://api.bitvavo.com/v2/markets',
                                           headers={'User-Agent':'crypto-market-research/1.0'})
              with urllib.request.urlopen(req, timeout=12) as response:
                  bv_markets = json.load(response)
              bitvavo_status = {'available': True,
                                'eur_markets': sum(1 for m in bv_markets
                                    if m.get('quote') == 'EUR' and m.get('status') == 'trading')}
          except Exception as exc:
              bitvavo_status['error'] = str(exc)[:180]
          prior = load(ROOT / 'latest.json', {})
          # Earlier test used mismatched base/quote units for buyer pressure.
          # Do not treat those historical candidates as validated outcomes.
          watch = load(ROOT / 'watchlist.json', {})
          if not isinstance(watch, dict): watch = {}
          history = load(ROOT / 'signals.json', [])
          if not isinstance(history, list): history = []
          errors, found, followups = [], [], []
          examined = 0
          for _, symbol, t in ordered:
              try:
                  bars = fetch('klines', {'symbol':symbol, 'interval':'5m', 'limit':1000})
                  closed = [c for c in bars if int(c[6]) < now]
                  if len(closed) < 290: continue
                  examined += 1
                  last = closed[-1]
                  price = float(last[4])
                  change24 = 100 * (price / float(closed[-289][4]) - 1)
                  vol = float(last[7])
                  baseline = sorted(float(c[7]) for c in closed[-289:-1])
                  median = (baseline[143] + baseline[144]) / 2
                  ratio = vol / median if median > 0 else 0
                  high1h = max(float(c[2]) for c in closed[-13:-1])
                  high6h = max(float(c[2]) for c in closed[-73:-1])
                  breakout1h = price > high1h
                  breakout6h = price > high6h
                  prior_range = closed[-25:-1]
                  compression = ((max(float(c[2]) for c in prior_range) /
                                  min(float(c[3]) for c in prior_range) - 1) < .035)
                  # Binance kline index 10 = taker-buy QUOTE volume; index 7 = total QUOTE volume.
                  # Index 9 is taker-buy BASE volume and must not be mixed with quote volume.
                  buy_quote = sum(float(c[10]) for c in closed[-3:])
                  total_quote = sum(float(c[7]) for c in closed[-3:])
                  if total_quote <= 0 or not (0 <= buy_quote <= total_quote * 1.000001):
                      raise ValueError('Invalid taker-buy quote volume')
                  buy_share = min(1.0, max(0.0, buy_quote / total_quote))
                  factors = {'volume':ratio >= 2, 'breakout_1h':breakout1h,
                             'breakout_6h':breakout6h, 'buyer_pressure':buy_share >= .58,
                             'compression':compression}
                  # Breakouts across overlapping windows count as one independent factor.
                  independent = int(factors['volume']) + int(breakout1h or breakout6h) + int(factors['buyer_pressure']) + int(compression)
                  early = -2 <= change24 < 15 and (ratio >= 2 or breakout1h or breakout6h) and buy_share >= .48
                  level = 'B_TEST' if independent >= 4 and early else ('A_TEST' if independent >= 2 and factors['volume'] and early else 'WATCH_TEST')
                  if not early: continue
                  item = {'symbol':symbol, 'source':'Binance spot (NOT Bitvavo EUR)',
                          'candle_time':int(last[0]), 'price':price,
                          'change24_pct':round(change24,3),
                          'volume_ratio_median24h':round(ratio,2),
                          'buy_share_15m':round(buy_share,3),
                          'factors':factors, 'level':level,
                          'warning':'Experimental, not validated; no investment recommendation'}
                  found.append(item)
                  existing = watch.get(symbol)
                  if not existing or existing.get('status') in ('expired','invalidated'):
                      watch[symbol] = {'first_seen_utc':datetime.now(timezone.utc).isoformat(),
                                       'first_price':price, 'last_price':price,
                                       'max_price':price, 'min_price':price,
                                       'last_seen_utc':datetime.now(timezone.utc).isoformat(),
                                       'status':'tracking', 'level':level}
                      history.append(item)
                  else:
                      existing['last_price'] = price
                      existing['max_price'] = max(existing['max_price'], price)
                      existing['min_price'] = min(existing['min_price'], price)
                      existing['last_seen_utc'] = datetime.now(timezone.utc).isoformat()
                      existing['level'] = level
              except Exception as exc:
                  errors.append({'symbol':symbol,'error':str(exc)[:150]})
              time.sleep(.05)

          # Follow up on all tracked signals, even after they stop qualifying.
          for symbol, w in list(watch.items()):
              if symbol not in market or w.get('status') != 'tracking': continue
              price = num(market[symbol], 'lastPrice')
              if not price or not w.get('first_price'): continue
              w['last_price'] = price
              w['max_price'] = max(w.get('max_price', price), price)
              w['min_price'] = min(w.get('min_price', price), price)
              delta = (price / w['first_price'] - 1) * 100
              peak = (w['max_price'] / w['first_price'] - 1) * 100
              age = (now / 1000 - datetime.fromisoformat(w['first_seen_utc']).timestamp()) / 3600
              w['change_since_alert_pct'] = round(delta,2)
              w['max_gain_since_alert_pct'] = round(peak,2)
              w['age_hours'] = round(age,1)
              if age >= 168:
                  w['status'] = 'expired'
              elif delta <= -10:
                  w['status'] = 'invalidated'
              if w['status'] != 'tracking' or peak >= 10:
                  followups.append({'symbol':symbol,'status':w['status'],
                                    'change_pct':round(delta,2),'max_gain_pct':round(peak,2),
                                    'age_hours':round(age,1)})
          # Bound JSON growth; preserve original historical signal archive.
          save(ROOT / 'watchlist.json', watch)
          save(ROOT / 'signals.json', history[-10000:])
          previous = {s.get('symbol') for s in prior.get('signals', []) if isinstance(s,dict)}
          latest = {'scanned_at_utc':datetime.now(timezone.utc).isoformat(),
                    'source':'Binance spot USDT/USDC/EUR; Bitvavo verification NOT implemented',
                    'markets_discovered':len(market),
                    'markets_preselected':len(candidates),
                    'markets_requested':len(ordered), 'markets_ok':examined,
                    'bitvavo_market_probe':bitvavo_status,
                    'coverage_note':'All Binance tickers checked; candle checks rotate through eligible markets.',
                    'radar_count':len(found),
                    'new_signal_count':len([s for s in found if s['symbol'] not in previous]),
                    'signals':found[:100], 'followups':followups[:100],
                    'errors':errors[:40],
                    'coverage_warning':'Rotating Binance candle coverage; Bitvavo EUR prices, forums and news NOT verified. Signals experimental.'}
          save(ROOT / 'latest.json', latest)
          print('Discovered:',len(market),'scanned:',examined,'signals:',len(found),'errors:',len(errors))
          PY
      - name: Save radar data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/radar/
          if ! git diff --cached --quiet; then
            git commit -m 'Update broad market radar and follow-up'
            git push
          fi
