name: Bitvavo Marktdaten

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Binance-Daten sammeln und RADAR testen
        run: |
          mkdir -p data/binance data/radar
          python3 - <<'PY'
          import json
          import statistics
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          coins = ['RLC','ZEUS','RAD','MET','OGN','MAGIC','KAIA','LUMIA','STRK','ZRC','RSR','GTC','OSMO','CTK','GNS','WAL','PUFFER','POND','IRYS','IOST']
          now = datetime.now(timezone.utc).isoformat()
          success = 0
          errors = []
          signals = []
          for coin in coins:
              symbol = coin + 'USDT'
              url = f'https://data-api.binance.vision/api/v3/klines?symbol={symbol}&interval=5m&limit=1000'
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      candles = json.load(response)
                  if not isinstance(candles, list) or not candles or not isinstance(candles[0], list):
                      raise ValueError('Keine gueltigen Kerzen')
                  # Letzte noch offene 5-Minuten-Kerze nicht fuer Signale verwenden.
                  closed = [c for c in candles if int(c[6]) < int(time.time() * 1000)]
                  if len(closed) < 300:
                      raise ValueError('Zu wenig abgeschlossene Kerzen')
                  path = Path('data/binance') / f'{symbol}-5m.json'
                  previous = json.loads(path.read_text()) if path.exists() else []
                  merged = {int(c[0]): c for c in previous + closed}
                  path.write_text(json.dumps([merged[t] for t in sorted(merged)], separators=(',', ':')))
                  success += 1
                  # Provisorischer RADAR-Test: Kursbewegung noch unter 15% in 24h,
                  # relative Volumenauffaelligkeit und Bruch des 6h-Hochs.
                  close = float(closed[-1][4])
                  old_close = float(closed[-289][4]) if len(closed) >= 289 else None
                  change_24h = (close / old_close - 1) * 100 if old_close and old_close > 0 else None
                  volumes = [float(c[7]) for c in closed]  # Quote-Asset-Volumen (USDT)
                  baseline = statistics.median(volumes[-289:-1])
                  recent_volume = sum(volumes[-3:])
                  relative_volume = recent_volume / (3 * baseline) if baseline > 0 else 0
                  prior_high = max(float(c[2]) for c in closed[-73:-1])
                  breakout = close > prior_high
                  if change_24h is not None and 0 <= change_24h < 15 and relative_volume >= 3 and breakout:
                      signals.append({'symbol': symbol, 'timestamp_utc': now,
                                      'price_usdt': close, 'change_24h_pct': round(change_24h, 2),
                                      'relative_volume_3x5m_vs_median': round(relative_volume, 2),
                                      'breakout_above_prior_6h': prior_high,
                                      'status': 'EXPERIMENTAL_RADAR_NOT_A_BUY_SIGNAL'})
                      print(f'RADAR-TEST: {symbol} {close} USDT, 24h {change_24h:.2f}%, Volumen {relative_volume:.1f}x')
                  print(f'OK: {symbol}: {len(merged)} Kerzen, 24h={change_24h:.2f}%' if change_24h is not None else f'OK: {symbol}: {len(merged)} Kerzen')
              except Exception as exc:
                  errors.append(f'{symbol}: {exc}')
                  print(f'FEHLER: {symbol}: {exc}')
              time.sleep(0.2)
          if success == 0:
              raise RuntimeError('Keine einzige Datenreihe geladen; Workflow fehlgeschlagen')
          # Jeder RADAR-Treffer wird nur einmal pro abgeschlossener 5-Minuten-Kerze gespeichert.
          history_path = Path('data/radar/signals.json')
          history = json.loads(history_path.read_text()) if history_path.exists() else []
          known = {(s['symbol'], s['candle_open_ms']) for s in history if 'candle_open_ms' in s}
          for s in signals:
              # Da die letzte Kerze beim Scan abgeschlossen ist, ihren Zeitpunkt aus den gespeicherten Daten lesen.
              candles_for_symbol = json.loads((Path('data/binance') / f"{s['symbol']}-5m.json").read_text())
              s['candle_open_ms'] = int(candles_for_symbol[-1][0])
              key = (s['symbol'], s['candle_open_ms'])
              if key not in known:
                  history.append(s)
                  known.add(key)
          history_path.write_text(json.dumps(history, ensure_ascii=False, indent=2))
          Path('data/radar/last_run.json').write_text(json.dumps({
              'timestamp_utc': now, 'successful_pairs': success, 'requested_pairs': len(coins),
              'errors': errors, 'new_experimental_signals': len(signals),
              'note': 'Binance USDT only; no verified Bitvavo EUR quote or buy recommendation.'
          }, ensure_ascii=False, indent=2))
          print(f'ERGEBNIS: {success}/{len(coins)} Paare; {len(signals)} RADAR-Testsignale; {len(errors)} Fehler')
          PY
      - name: Ergebnisse speichern
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/binance/ data/radar/
          if ! git diff --cached --quiet; then
            git commit -m 'Collect Binance candles and experimental radar signals'
            git push
          fi
