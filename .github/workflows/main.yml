name: Bitvavo Marktdaten

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Binance Kerzen und RADAR pruefen
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          coins = ["RLC","ZEUS","RAD","MET","OGN","MAGIC","KAIA",
                   "LUMIA","STRK","ZRC","RSR","GTC","OSMO","CTK",
                   "GNS","WAL","PUFFER","POND","IRYS","IOST"]
          base = Path('data/binance')
          radar = Path('data/radar')
          base.mkdir(parents=True, exist_ok=True)
          radar.mkdir(parents=True, exist_ok=True)
          signals_path = radar / 'signals.json'
          signals = json.loads(signals_path.read_text()) if signals_path.exists() else []
          if not isinstance(signals, list):
              raise RuntimeError('signals.json ist keine Liste')
          seen = {(s['symbol'], s['candle_time']) for s in signals}
          current = []
          failures = []
          successes = 0
          new_signals = 0
          now_ms = int(time.time() * 1000)

          for coin in coins:
              symbol = coin + 'USDT'
              url = ('https://data-api.binance.vision/api/v3/klines?'
                     f'symbol={symbol}&interval=5m&limit=1000')
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=25) as response:
                      candles = json.load(response)
                  if not isinstance(candles, list):
                      raise ValueError('Ungueltige Kerzendaten')
                  closed = [c for c in candles if int(c[6]) < now_ms]
                  if len(closed) < 300:
                      raise ValueError('Zu wenige abgeschlossene Kerzen')
                  path = base / f'{symbol}-5m.json'
                  old = json.loads(path.read_text()) if path.exists() else []
                  merged = {int(c[0]): c for c in old + closed}
                  path.write_text(json.dumps([merged[t] for t in sorted(merged)], separators=(',', ':')))
                  successes += 1

                  last = closed[-1]
                  price = float(last[4])
                  change24 = (price / float(closed[-289][4]) - 1) * 100
                  vol = float(last[7])
                  avg_vol = sum(float(c[7]) for c in closed[-289:-1]) / 288
                  ratio = vol / avg_vol if avg_vol else 0
                  prior_high = max(float(c[2]) for c in closed[-73:-1])
                  breakout = price > prior_high
                  # Testkriterien, noch nicht historisch validiert.
                  radar_flag = (0 <= change24 < 15 and (ratio >= 3 or breakout))
                  a_flag = (0 <= change24 < 15 and ratio >= 3 and breakout)
                  record = {
                      'symbol': symbol,
                      'source': 'Binance spot USDT, NICHT Bitvavo EUR',
                      'candle_time': int(last[0]),
                      'price_usdt': price,
                      'change24_pct': round(change24, 3),
                      'volume_ratio_24h': round(ratio, 3),
                      'prior_6h_high_usdt': prior_high,
                      'breakout_6h': breakout,
                      'level': 'A_TEST' if a_flag else ('RADAR_TEST' if radar_flag else 'NONE'),
                      'note': 'Experimentell; keine Kaufempfehlung; EUR-Preis nicht bestaetigt'
                  }
                  if radar_flag:
                      current.append(record)
                      key = (symbol, int(last[0]))
                      if key not in seen:
                          signals.append(record)
                          seen.add(key)
                          new_signals += 1
                  print(f'{symbol}: 24h={change24:+.2f}% vol={ratio:.2f}x '
                        f'breakout={breakout} level={record["level"]}')
              except Exception as exc:
                  failures.append({'symbol': symbol, 'error': str(exc)})
                  print(f'FEHLER {symbol}: {exc}')
              time.sleep(0.2)

          if successes == 0:
              raise RuntimeError('Keine Binance-Daten erhalten; latest.json nicht aktualisiert')
          signals_path.write_text(json.dumps(signals, indent=2))
          latest = {
              'scanned_at_utc': datetime.now(timezone.utc).isoformat(),
              'source': 'Binance spot USDT (nicht Bitvavo EUR)',
              'markets_requested': len(coins),
              'markets_ok': successes,
              'radar_count': len(current),
              'new_signal_count': new_signals,
              'signals': current,
              'errors': failures,
              'warning': 'Testsignale, nicht validiert; keine Bitvavo-EUR-Preise oder Kaufempfehlungen'
          }
          (radar / 'latest.json').write_text(json.dumps(latest, indent=2))
          print(f'ERGEBNIS: {successes}/{len(coins)}; aktuelle RADAR={len(current)}; neue={new_signals}')
          print('Datei: data/radar/latest.json')
          PY
      - name: Daten speichern
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/binance/ data/radar/
          if ! git diff --cached --quiet; then
            git commit -m 'Update Binance candles and radar latest'
            git push
          fi
