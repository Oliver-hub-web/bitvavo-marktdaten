name: Bitvavo Marktdaten

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bitvavo Kerzen abrufen
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          coins = ["POND", "PUFFER", "RLC", "ZEUS", "RAD", "MET", "OGN", "MAGIC", "KAIA", "LUMIA", "STRK", "ZRC", "RSR", "GTC", "OSMO", "CTK", "GNS", "WAL", "DOS", "SAFE", "CTR", "SAGA"]
          for coin in coins:
              market = f"{coin}-EUR"
              url = f"https://api.bitvavo.com/v2/{market}/candles?interval=5m&limit=1000"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "BitvavoMarketDataCollector/1.0"})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      candles = json.load(response)
                  if not isinstance(candles, list):
                      raise ValueError("Unexpected API response")
                  path = Path("data") / f"{coin}-EUR.json"
                  previous = json.loads(path.read_text()) if path.exists() else []
                  merged = {int(c[0]): c for c in previous + candles}
                  result = [merged[t] for t in sorted(merged)]
                  path.write_text(json.dumps(result, separators=(",", ":")))
                  print(f"{market}: {len(result)} candles")
              except Exception as exc:
                  print(f"{market}: ERROR {exc}")
          Path("data/last_run.txt").write_text(datetime.now(timezone.utc).isoformat())
          PY
      - name: Daten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update Bitvavo candles"
            git push
          fi
