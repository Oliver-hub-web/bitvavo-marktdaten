name: Bitvavo Marktdaten

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Binance Kerzen abrufen
        run: |
          mkdir -p data/binance
          python3 - <<'PY'
          import json
          import time
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone
          from pathlib import Path

          coins = [
              "RLC", "ZEUS", "RAD", "MET", "OGN",
              "MAGIC", "KAIA", "LUMIA", "STRK",
              "ZRC", "RSR", "GTC", "OSMO", "CTK",
              "GNS", "WAL", "PUFFER", "POND",
              "IRYS", "IOST"
          ]

          success = 0
          failed = []

          for coin in coins:
              symbol = f"{coin}USDT"
              url = (
                  "https://data-api.binance.vision"
                  f"/api/v3/klines?symbol={symbol}"
                  "&interval=5m&limit=1000"
              )

              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )

                  with urllib.request.urlopen(
                      req, timeout=20
                  ) as response:
                      candles = json.load(response)

                  if not isinstance(candles, list) or not candles:
                      raise ValueError("Keine Kerzendaten")

                  path = Path(
                      f"data/binance/{symbol}-5m.json"
                  )

                  previous = (
                      json.loads(path.read_text())
                      if path.exists() else []
                  )

                  merged = {
                      int(c[0]): c
                      for c in previous + candles
                  }

                  result = [
                      merged[t] for t in sorted(merged)
                  ]

                  path.write_text(
                      json.dumps(result, separators=(",", ":"))
                  )

                  success += 1
                  print(
                      f"ERFOLG: {symbol}: "
                      f"{len(result)} Kerzen gespeichert"
                  )

              except Exception as exc:
                  failed.append(symbol)
                  print(f"NICHT VERFÜGBAR: {symbol}: {exc}")

              time.sleep(0.2)

          print(f"ERGEBNIS: {success}/{len(coins)} erfolgreich")
          print(f"FEHLGESCHLAGEN: {', '.join(failed)}")

          if success == 0:
              raise RuntimeError("Keine Kursdaten abgerufen!")

          Path("data/binance/last_run.txt").write_text(
              datetime.now(timezone.utc).isoformat()
          )
          PY

      - name: Daten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/binance/
          if ! git diff --cached --quiet; then
            git commit -m "Update Binance market data"
            git push
          fi
